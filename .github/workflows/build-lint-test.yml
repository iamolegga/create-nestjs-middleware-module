name: build-lint-test

on:
  workflow_call:

jobs:
  build-lint-test:
    strategy:
      fail-fast: false
      matrix:
        nestjs-version:
          # 11.2.0 is the oldest release on which the default wildcard route
          # survives a global prefix on both platforms: `addLeadingSlash` keeps
          # a `{/` path intact from 11.0.8, and fastify stopped dropping the
          # middleware on globally-excluded paths in 11.2.0.
          - "11.2.0"
          - "11"
          - "12"
        nodejs-version:
          - 22
          - 24
          - 26

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.nodejs-version }}
      - run: npm ci
      - run: |
          npm i @nestjs/core@${{ matrix.nestjs-version }} \
                @nestjs/common@${{ matrix.nestjs-version }} \
                @nestjs/platform-express@${{ matrix.nestjs-version }} \
                @nestjs/platform-fastify@${{ matrix.nestjs-version }} \
                @types/node@${{ matrix.nodejs-version }} \
                -D
      - run: npm run lint
      - uses: actions/cache@v6.1.0
        with:
          path: coverage
          key: ${{ github.sha }}-${{ matrix.nestjs-version }}-${{ matrix.nodejs-version }}
      - run: npm t
      - run: npm run build
